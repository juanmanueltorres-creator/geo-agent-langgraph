[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-agent-langgraph"
version = "0.1.0"
description = "A minimal geospatial AI agent built with LangChain, LangGraph, DeepSeek and real-world APIs."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "langchain>=1.3,<2",
  "langchain-deepseek>=1.1,<2",
  "langgraph>=1.2,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-httpx>=0.35,<1",
]

[project.scripts]
geo-agent = "geo_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
